<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Portfolio</title>

<!-- PRÉCHARGEMENT DES 5 IMAGES DE SURVOL -->
<link rel="preload" href="etoile-portfolio.png" as="image">
<link rel="preload" href="etoile-cv.png" as="image">
<link rel="preload" href="etoile-volume.png" as="image">
<link rel="preload" href="etoile-zine.png" as="image">
<link rel="preload" href="etoile-dessin.png" as="image">

<style>

body{
    margin:0;
    background:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#container{
    position:relative;
    width:1200px;
}

#etoile{
    width:100%;
    display:block;
}

.zone{
    position:absolute;
    cursor:pointer;
}


/* ========================= */
/* ZONE PORTFOLIO */
/* ========================= */

#portfolio{
    top:312px;
    left:288px;
    width:216px;
    height:192px;
}


/* ========================= */
/* ZONE CV */
/* ========================= */

#cv{
    top:144px;
    left:522px;
    width:156px;
    height:264px;
}


/* ========================= */
/* ZONE VOLUME */
/* ========================= */

#volume{
    top:312px;
    right:288px;
    width:216px;
    height:192px;
}


/* ========================= */
/* ZONE ZINE */
/* ========================= */

#zine{
    bottom:276px;
    left:384px;
    width:192px;
    height:204px;
}


/* ========================= */
/* ZONE DESSIN */
/* ========================= */

#dessin{
    bottom:276px;
    right:384px;
    width:192px;
    height:204px;
}

</style>
</head>


<body>

<div id="container">

    <!-- IMAGE DE BASE -->
    <img id="etoile" src="etoile.png" alt="">


    <!-- PORTFOLIO -->
    <div
        class="zone"
        id="portfolio"
        onmouseover="changeImage('etoile-portfolio.png')"
        onmouseout="resetImage()"
        onclick="location.href='portfolio.html'">
    </div>


    <!-- CV -->
    <div
        class="zone"
        id="cv"
        onmouseover="changeImage('etoile-cv.png')"
        onmouseout="resetImage()"
        onclick="location.href='cv.html'">
    </div>


    <!-- VOLUME -->
    <div
        class="zone"
        id="volume"
        onmouseover="changeImage('etoile-volume.png')"
        onmouseout="resetImage()"
        onclick="location.href='volume.html'">
    </div>


    <!-- ZINE -->
    <div
        class="zone"
        id="zine"
        onmouseover="changeImage('etoile-zine.png')"
        onmouseout="resetImage()"
        onclick="location.href='zine.html'">
    </div>


    <!-- DESSIN -->
    <div
        class="zone"
        id="dessin"
        onmouseover="changeImage('etoile-dessin.png')"
        onmouseout="resetImage()"
        onclick="location.href='dessin.html'">
    </div>

</div>


<script>

/* ========================= */
/* PRÉCHARGEMENT DES IMAGES */
/* ========================= */

const images = [
    "etoile-portfolio.png",
    "etoile-cv.png",
    "etoile-volume.png",
    "etoile-zine.png",
    "etoile-dessin.png"
];

images.forEach(function(src){

    const img = new Image();

    img.src = src;

});


/* ========================= */
/* CHANGEMENT D'IMAGE */
/* ========================= */

function changeImage(image){

    document.getElementById("etoile").src = image;

}


/* ========================= */
/* RETOUR À L'IMAGE DE BASE */
/* ========================= */

function resetImage(){

    document.getElementById("etoile").src = "etoile.png";

}

</script>

</body>
</html>
