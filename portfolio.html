<a id="retour" href="index.html">Retour</a>

<main id="pdf"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    const PDF_FILE = "SYLVAIN_BESSA_dossiervisuel.pdf";

    const MAX_WIDTH = 900;
    const MAX_PIXEL_RATIO = 2;

    /*
     * Nombre maximum de pages rendues simultanément.
     * 2 est généralement un bon compromis entre
     * vitesse et consommation CPU.
     */
    const MAX_CONCURRENT_RENDERS = 2;

    /*
     * Nombre de pages anticipées.
     */
    const PRELOAD_DISTANCE = 4;

    const container = document.getElementById("pdf");

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    let pdf = null;

    const pages = new Map();
    const jobs = new Map();

    let activeRenders = 0;
    const queue = [];


    function displayWidth() {
        return Math.min(
            MAX_WIDTH,
            window.innerWidth - 40
        );
    }


    function pixelRatio() {
        return Math.min(
            window.devicePixelRatio || 1,
            MAX_PIXEL_RATIO
        );
    }


    function enqueue(pageNumber, priority = false) {

        if (
            pages.has(pageNumber) ||
            jobs.has(pageNumber)
        ) {
            return;
        }

        const job = {
            pageNumber,
            priority
        };

        if (priority) {
            queue.unshift(job);
        } else {
            queue.push(job);
        }

        jobs.set(pageNumber, job);

        processQueue();
    }


    function processQueue() {

        while (
            activeRenders < MAX_CONCURRENT_RENDERS &&
            queue.length
        ) {

            const job = queue.shift();

            activeRenders++;

            renderPage(job.pageNumber)
                .finally(() => {

                    activeRenders--;

                    jobs.delete(
                        job.pageNumber
                    );

                    processQueue();
                });
        }
    }


    async function renderPage(pageNumber) {

        const page =
            await pdf.getPage(pageNumber);


        const baseViewport =
            page.getViewport({
                scale: 1
            });


        const width =
            displayWidth();


        const scale =
            width / baseViewport.width;


        const viewport =
            page.getViewport({
                scale
            });


        const ratio =
            pixelRatio();


        const canvas =
            document.createElement("canvas");


        canvas.className = "page";

        canvas.dataset.page =
            pageNumber;


        /*
         * On réserve l'espace immédiatement.
         * Le document ne saute donc pas lorsque
         * la page apparaît.
         */
        canvas.style.width =
            `${viewport.width}px`;

        canvas.style.height =
            `${viewport.height}px`;


        canvas.width =
            Math.ceil(
                viewport.width * ratio
            );

        canvas.height =
            Math.ceil(
                viewport.height * ratio
            );


        container.appendChild(canvas);


        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false,
                    desynchronized: true
                }
            );


        context.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );


        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;


        pages.set(
            pageNumber,
            canvas
        );


        /*
         * La page entière est maintenant
         * disponible.
         */
        canvas.classList.add("ready");


        return canvas;
    }


    function preloadAround(pageNumber) {

        const start =
            Math.max(1, pageNumber);

        const end =
            Math.min(
                pdf.numPages,
                pageNumber + PRELOAD_DISTANCE
            );


        for (
            let i = start;
            i <= end;
            i++
        ) {
            enqueue(i);
        }
    }


    function observePages() {

        const observer =
            new IntersectionObserver(
                entries => {

                    for (
                        const entry
                        of entries
                    ) {

                        if (
                            !entry.isIntersecting
                        ) {
                            continue;
                        }


                        const pageNumber =
                            Number(
                                entry.target.dataset.page
                            );


                        preloadAround(
                            pageNumber + 1
                        );
                    }

                },
                {
                    rootMargin:
                        "2500px 0px 2500px 0px",

                    threshold: 0
                }
            );


        const observeNewPages =
            () => {

                for (
                    const canvas
                    of pages.values()
                ) {

                    if (
                        !canvas.dataset.observed
                    ) {

                        canvas.dataset.observed =
                            "true";

                        observer.observe(
                            canvas
                        );
                    }
                }
            };


        observeNewPages();


        /*
         * On vérifie uniquement lorsque le
         * navigateur est disponible pour le faire.
         */
        function check() {

            observeNewPages();

            if (
                "requestIdleCallback"
                in window
            ) {

                requestIdleCallback(
                    check
                );

            } else {

                setTimeout(
                    check,
                    1000
                );
            }
        }


        check();
    }


    async function start() {

        pdf =
            await pdfjsLib.getDocument({

                url: PDF_FILE,

                disableStream: false,

                disableAutoFetch: false,

                useWorkerFetch: true,

                isOffscreenCanvasSupported: true

            }).promise;


        /*
         * PAGE 1 :
         * priorité absolue.
         */
        enqueue(
            1,
            true
        );


        /*
         * On attend uniquement la page 1.
         */
        while (
            !pages.has(1)
        ) {

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        10
                    )
            );
        }


        /*
         * Préparation immédiate des pages
         * suivantes.
         */
        preloadAround(2);


        observePages();
    }


    start();

</script>
