<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Dessin</title>

<style>

body{
    margin:0;
    background:white;
    font-family:"Times New Roman", serif;
    overflow-y:auto;
    overflow-x:hidden;
}

#retour{
    position:fixed;
    top:20px;
    left:20px;
    color:blue;
    text-decoration:underline;
    font-size:18px;
    z-index:300;
}

.page{
    padding-top:90px;
    padding-bottom:160px;
}

.serie{
    width:100vw;
    margin-bottom:160px;
}


/* =========================
   TITRE + ICÔNE
========================= */

.titre-conteneur{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:25px;
}

.titre-serie{
    text-align:center;
    font-size:22px;
    margin:0;
    font-weight:normal;
    line-height:1.3;
}


/* =========================
   ICÔNE APPAREIL PHOTO
========================= */

.camera{
    position:relative;
    width:24px;
    height:17px;
    border:1.5px solid black;
    box-sizing:border-box;
    cursor:pointer;
    flex-shrink:0;
}

.camera:before{
    content:"";
    position:absolute;
    width:8px;
    height:4px;
    border:1.5px solid black;
    border-bottom:none;
    left:4px;
    top:-6px;
    box-sizing:border-box;
}

.camera:after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border:1.5px solid black;
    border-radius:50%;
    left:7px;
    top:3px;
    box-sizing:border-box;
}

.camera:hover{
    opacity:0.5;
}


/* =========================
   MENU DES DESSINS
========================= */

.menu-horizontal{
    width:100vw;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    padding:45px 60px;
    box-sizing:border-box;
    border-top:1px solid black;
    border-bottom:1px solid black;
    background:white;
}

.miniature{
    height:360px;
    margin-right:45px;
    cursor:pointer;
    vertical-align:middle;
    border:1px solid black;
}

.miniature:hover{
    opacity:0.75;
}


/* =========================
   POP-UP DES DESSINS
========================= */

#popup{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(255,255,255,0.75);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

#popup-contenu{
    position:relative;
    background:white;
    border:1px solid black;
    padding:20px;
    max-width:90vw;
    max-height:90vh;
    box-sizing:border-box;
}

#image-popup{
    display:block;
    max-width:85vw;
    max-height:82vh;
    object-fit:contain;
}

#fermer{
    position:absolute;
    top:5px;
    right:10px;
    font-size:22px;
    cursor:pointer;
    color:black;
}


/* =========================
   CONTENEUR DES PHOTOS
========================= */

#photos-popup{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(255,255,255,0.35);
    display:none;
    z-index:200;
}


/* =========================
   FENÊTRE PHOTO
========================= */

.fenetre-photo{

    position:fixed;

    width:500px;
    height:400px;

    min-width:240px;
    min-height:180px;

    max-width:90vw;
    max-height:90vh;

    overflow:hidden;

    background:white;

    border:1px solid black;

    box-sizing:border-box;
}


/* =========================
   BARRE SUPÉRIEURE
========================= */

.barre-fenetre{

    height:30px;

    border-bottom:1px solid black;

    box-sizing:border-box;

    cursor:move;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding-left:8px;

    user-select:none;

    flex-shrink:0;
}

.controles{

    display:flex;

    align-items:center;

    height:100%;
}

.bouton{

    width:28px;

    height:28px;

    border:none;

    background:white;

    font-family:"Times New Roman", serif;

    font-size:18px;

    line-height:28px;

    text-align:center;

    cursor:pointer;

    padding:0;
}

.bouton:hover{

    background:#eeeeee;
}

.pourcentage{

    font-size:13px;

    width:42px;

    text-align:center;
}

.fermer-photo{

    font-size:22px;

    line-height:28px;

    cursor:pointer;

    color:black;

    width:28px;

    height:28px;

    text-align:center;
}

.fermer-photo:hover{

    opacity:0.5;
}


/* =========================
   CONTENEUR DE L'IMAGE
========================= */

.conteneur-image{

    position:relative;

    width:100%;

    height:calc(100% - 30px);

    padding:8px;

    box-sizing:border-box;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:default;
}


/* =========================
   IMAGE
========================= */

.fenetre-photo img{

    display:block;

    width:auto;

    height:auto;

    max-width:100%;

    max-height:100%;

    object-fit:contain;

    transform-origin:center center;

    user-select:none;

    -webkit-user-drag:none;

    flex-shrink:0;
}


/* =========================
   QUAND L'IMAGE EST ZOOMÉE
========================= */

.conteneur-image.zoomable{

    cursor:grab;
}

.conteneur-image.zoomable:active{

    cursor:grabbing;
}


/* =========================
   POSITIONS INITIALES
========================= */

#fenetre-1{

    top:6vh;

    left:8vw;

    z-index:1;
}

#fenetre-2{

    top:18vh;

    left:38vw;

    z-index:2;
}


/* =========================
   COINS DE REDIMENSIONNEMENT
========================= */

.resize{

    position:absolute;

    width:14px;

    height:14px;

    z-index:20;
}


/* coin haut gauche */

.resize-tl{

    top:-2px;

    left:-2px;

    cursor:nwse-resize;
}


/* coin haut droit */

.resize-tr{

    top:-2px;

    right:-2px;

    cursor:nesw-resize;
}


/* coin bas gauche */

.resize-bl{

    bottom:-2px;

    left:-2px;

    cursor:nesw-resize;
}


/* coin bas droit */

.resize-br{

    bottom:-2px;

    right:-2px;

    cursor:nwse-resize;
}

</style>
</head>


<body>

<a id="retour" href="index.html">retour</a>


<div class="page">

    <div class="serie">

        <div class="titre-conteneur">

            <h1 class="titre-serie">
                séquence narrative de re-dessin par couches successives
            </h1>

            <div
                class="camera"
                onclick="ouvrirPhotos()"
                title="voir les photographies"
            ></div>

        </div>


        <div class="menu-horizontal">

            <img class="miniature" src="dessin-01.jpg" onclick="ouvrirPopup(0)">
            <img class="miniature" src="dessin-02.jpg" onclick="ouvrirPopup(1)">
            <img class="miniature" src="dessin-03.jpg" onclick="ouvrirPopup(2)">
            <img class="miniature" src="dessin-04.jpg" onclick="ouvrirPopup(3)">
            <img class="miniature" src="dessin-05.jpg" onclick="ouvrirPopup(4)">
            <img class="miniature" src="dessin-06.jpg" onclick="ouvrirPopup(5)">
            <img class="miniature" src="dessin-07.jpg" onclick="ouvrirPopup(6)">

        </div>

    </div>

</div>


<!-- =========================
     POP-UP DES DESSINS
========================= -->

<div id="popup" onclick="fermerPopup()">

    <div
        id="popup-contenu"
        onclick="event.stopPropagation()"
    >

        <div
            id="fermer"
            onclick="fermerPopup()"
        >×</div>

        <img
            id="image-popup"
            src=""
            alt=""
        >

    </div>

</div>


<!-- =========================
     FENÊTRES PHOTOS
========================= -->

<div id="photos-popup">


    <!-- =====================
         FENÊTRE 1
    ====================== -->

    <div
        id="fenetre-1"
        class="fenetre-photo"
    >

        <div
            class="barre-fenetre"
            onmousedown="commencerDeplacement(event,1)"
        >

            <span></span>

            <div class="controles">

                <button
                    class="bouton"
                    onclick="zoomPhoto(event,1,1.15)"
                >+</button>

                <div
                    id="pourcentage-1"
                    class="pourcentage"
                >100%</div>

                <button
                    class="bouton"
                    onclick="zoomPhoto(event,1,0.87)"
                >−</button>

                <button
                    class="bouton"
                    onclick="resetZoom(event,1)"
                >1:1</button>

                <div
                    class="fermer-photo"
                    onclick="fermerPhoto(1)"
                >×</div>

            </div>

        </div>


        <div
            id="conteneur-image-1"
            class="conteneur-image"
            onmousedown="commencerDeplacementImage(event,1)"
        >

            <img
                id="image-successives-1"
                src="successives-1.jpg"
                alt="Photographie du processus de redessin"
            >

        </div>


        <div
            class="resize resize-tl"
            onmousedown="commencerRedimensionnement(event,1,'tl')"
        ></div>

        <div
            class="resize resize-tr"
            onmousedown="commencerRedimensionnement(event,1,'tr')"
        ></div>

        <div
            class="resize resize-bl"
            onmousedown="commencerRedimensionnement(event,1,'bl')"
        ></div>

        <div
            class="resize resize-br"
            onmousedown="commencerRedimensionnement(event,1,'br')"
        ></div>

    </div>


    <!-- =====================
         FENÊTRE 2
    ====================== -->

    <div
        id="fenetre-2"
        class="fenetre-photo"
    >

        <div
            class="barre-fenetre"
            onmousedown="commencerDeplacement(event,2)"
        >

            <span></span>

            <div class="controles">

                <button
                    class="bouton"
                    onclick="zoomPhoto(event,2,1.15)"
                >+</button>

                <div
                    id="pourcentage-2"
                    class="pourcentage"
                >100%</div>

                <button
                    class="bouton"
                    onclick="zoomPhoto(event,2,0.87)"
                >−</button>

                <button
                    class="bouton"
                    onclick="resetZoom(event,2)"
                >1:1</button>

                <div
                    class="fermer-photo"
                    onclick="fermerPhoto(2)"
                >×</div>

            </div>

        </div>


        <div
            id="conteneur-image-2"
            class="conteneur-image"
            onmousedown="commencerDeplacementImage(event,2)"
        >

            <img
                id="image-successives-2"
                src="successives-2.jpg"
                alt="Photographie du processus de redessin"
            >

        </div>


        <div
            class="resize resize-tl"
            onmousedown="commencerRedimensionnement(event,2,'tl')"
        ></div>

        <div
            class="resize resize-tr"
            onmousedown="commencerRedimensionnement(event,2,'tr')"
        ></div>

        <div
            class="resize resize-bl"
            onmousedown="commencerRedimensionnement(event,2,'bl')"
        ></div>

        <div
            class="resize resize-br"
            onmousedown="commencerRedimensionnement(event,2,'br')"
        ></div>

    </div>

</div>


<script>


/* =========================
   DESSINS
========================= */

const dessins = [

    "dessin-01.jpg",
    "dessin-02.jpg",
    "dessin-03.jpg",
    "dessin-04.jpg",
    "dessin-05.jpg",
    "dessin-06.jpg",
    "dessin-07.jpg"

];

let imageActuelle = 0;


/* =========================
   OUVRIR UN DESSIN
========================= */

function ouvrirPopup(index){

    imageActuelle = index;

    document.getElementById("image-popup").src =
        dessins[imageActuelle];

    document.getElementById("popup").style.display =
        "flex";
}


/* =========================
   FERMER UN DESSIN
========================= */

function fermerPopup(){

    document.getElementById("popup").style.display =
        "none";

    document.getElementById("image-popup").src =
        "";
}


/* =========================
   DESSIN SUIVANT
========================= */

function imageSuivante(){

    imageActuelle++;

    if(imageActuelle >= dessins.length){

        imageActuelle = 0;
    }

    document.getElementById("image-popup").src =
        dessins[imageActuelle];
}


/* =========================
   DESSIN PRÉCÉDENT
========================= */

function imagePrecedente(){

    imageActuelle--;

    if(imageActuelle < 0){

        imageActuelle =
            dessins.length - 1;
    }

    document.getElementById("image-popup").src =
        dessins[imageActuelle];
}


/* =========================
   VARIABLES ZOOM
========================= */

let zooms = {

    1:1,
    2:1

};


/*
   Position du cadrage lorsque
   l'image est zoomée.
*/

let positionsImage = {

    1:{
        x:0,
        y:0
    },

    2:{
        x:0,
        y:0
    }

};


/* =========================
   OUVRIR LES PHOTOS
========================= */

function ouvrirPhotos(){

    const photosPopup =
        document.getElementById("photos-popup");

    const fenetre1 =
        document.getElementById("fenetre-1");

    const fenetre2 =
        document.getElementById("fenetre-2");


    photosPopup.style.display =
        "block";


    fenetre1.style.display =
        "block";

    fenetre2.style.display =
        "block";


    fenetre1.style.zIndex =
        "1";

    fenetre2.style.zIndex =
        "2";


    zooms[1] = 1;
    zooms[2] = 1;


    positionsImage[1].x = 0;
    positionsImage[1].y = 0;

    positionsImage[2].x = 0;
    positionsImage[2].y = 0;


    initialiserFenetre(1);
    initialiserFenetre(2);
}


/* =========================
   INITIALISATION
========================= */

function initialiserFenetre(numero){

    const fenetre =
        document.getElementById(
            "fenetre-" + numero
        );

    const image =
        document.getElementById(
            "image-successives-" + numero
        );


    function calculer(){

        if(
            !image.naturalWidth ||
            !image.naturalHeight
        ){

            return;
        }


        const ratio =
            image.naturalWidth /
            image.naturalHeight;


        /*
           Taille de départ de la fenêtre.

           On calcule directement à partir
           du ratio de l'image.
        */

        const largeurMax =
            window.innerWidth * 0.48;

        const hauteurMax =
            window.innerHeight * 0.68;


        let largeur =
            largeurMax;

        let hauteur =
            largeur / ratio;


        if(hauteur > hauteurMax){

            hauteur =
                hauteurMax;

            largeur =
                hauteur * ratio;
        }


        /*
           Seulement 18 px de marge totale
           autour de l'image.
        */

        const largeurFenetre =
            largeur + 18;

        const hauteurFenetre =
            hauteur + 48;


        fenetre.style.width =
            largeurFenetre + "px";

        fenetre.style.height =
            hauteurFenetre + "px";


        /*
           Positions initiales.
        */

        if(numero === 1){

            fenetre.style.left =
                Math.round(
                    window.innerWidth * 0.08
                ) + "px";

            fenetre.style.top =
                Math.round(
                    window.innerHeight * 0.08
                ) + "px";
        }

        else{

            fenetre.style.left =
                Math.round(
                    window.innerWidth * 0.38
                ) + "px";

            fenetre.style.top =
                Math.round(
                    window.innerHeight * 0.20
                ) + "px";
        }


        appliquerTailleImage(numero);
    }


    if(
        image.complete &&
        image.naturalWidth
    ){

        calculer();

    }

    else{

        image.addEventListener(
            "load",
            calculer,
            {once:true}
        );
    }
}


/* =========================
   CALCUL DE LA TAILLE IMAGE
========================= */

function appliquerTailleImage(numero){

    const fenetre =
        document.getElementById(
            "fenetre-" + numero
        );

    const image =
        document.getElementById(
            "image-successives-" + numero
        );

    const conteneur =
        document.getElementById(
            "conteneur-image-" + numero
        );


    if(
        !image.naturalWidth ||
        !image.naturalHeight
    ){

        return;
    }


    /*
       Taille disponible réelle.

       On retire uniquement le padding
       de 8px de chaque côté.
    */

    const largeurDisponible =
        conteneur.clientWidth - 16;

    const hauteurDisponible =
        conteneur.clientHeight - 16;


    const ratio =
        image.naturalWidth /
        image.naturalHeight;


    let largeur =
        largeurDisponible;

    let hauteur =
        largeur / ratio;


    if(hauteur > hauteurDisponible){

        hauteur =
            hauteurDisponible;

        largeur =
            hauteur * ratio;
    }


    /*
       La taille calculée correspond à
       l'image à 100%.
    */

    image.style.width =
        largeur + "px";

    image.style.height =
        hauteur + "px";


    /*
       On remet le zoom après avoir
       recalculé la taille de base.
    */

    appliquerZoom(numero);
}


/* =========================
   FERMER UNE PHOTO
========================= */

function fermerPhoto(numero){

    document.getElementById(
        "fenetre-" + numero
    ).style.display =
        "none";


    const photo1 =
        document.getElementById(
            "fenetre-1"
        ).style.display;

    const photo2 =
        document.getElementById(
            "fenetre-2"
        ).style.display;


    if(
        photo1 === "none" &&
        photo2 === "none"
    ){

        document.getElementById(
            "photos-popup"
        ).style.display =
            "none";
    }
}


/* =========================
   ZOOM
========================= */

function zoomPhoto(
    event,
    numero,
    facteur
){

    event.stopPropagation();


    let nouveauZoom =
        zooms[numero] * facteur;


    if(nouveauZoom < 0.5){

        nouveauZoom = 0.5;
    }


    if(nouveauZoom > 4){

        nouveauZoom = 4;
    }


    zooms[numero] =
        nouveauZoom;


    appliquerZoom(numero);
}


/* =========================
   APPLIQUER LE ZOOM
========================= */

function appliquerZoom(numero){

    const image =
        document.getElementById(
            "image-successives-" + numero
        );

    const conteneur =
        document.getElementById(
            "conteneur-image-" + numero
        );


    image.style.transform =
        "translate(" +
        positionsImage[numero].x +
        "px," +
        positionsImage[numero].y +
        "px) scale(" +
        zooms[numero] +
        ")";


    document.getElementById(
        "pourcentage-" + numero
    ).textContent =
        Math.round(
            zooms[numero] * 100
        ) + "%";


    /*
       Le déplacement n'est possible
       que lorsque l'image est zoomée.
    */

    if(zooms[numero] > 1){

        conteneur.classList.add(
            "zoomable"
        );

    }

    else{

        conteneur.classList.remove(
            "zoomable"
        );
    }
}


/* =========================
   RESET ZOOM
========================= */

function resetZoom(
    event,
    numero
){

    event.stopPropagation();


    zooms[numero] = 1;


    positionsImage[numero].x = 0;
    positionsImage[numero].y = 0;


    appliquerZoom(numero);
}


/* =========================
   DÉPLACEMENT DE LA FENÊTRE
========================= */

let fenetreEnDeplacement = null;

let decalageX = 0;
let decalageY = 0;


function commencerDeplacement(
    event,
    numero
){

    if(
        event.target.closest("button") ||
        event.target.closest(".fermer-photo")
    ){

        return;
    }


    const fenetre =
        document.getElementById(
            "fenetre-" + numero
        );


    fenetreEnDeplacement =
        fenetre;


    const rectangle =
        fenetre.getBoundingClientRect();


    decalageX =
        event.clientX -
        rectangle.left;

    decalageY =
        event.clientY -
        rectangle.top;


    fenetre.style.left =
        rectangle.left + "px";

    fenetre.style.top =
        rectangle.top + "px";

    fenetre.style.right =
        "auto";


    fenetre.style.zIndex =
        "10";


    document.addEventListener(
        "mousemove",
        deplacerFenetre
    );

    document.addEventListener(
        "mouseup",
        terminerDeplacement
    );


    event.preventDefault();
}


function deplacerFenetre(event){

    if(!fenetreEnDeplacement){

        return;
    }


    fenetreEnDeplacement.style.left =
        (
            event.clientX -
            decalageX
        ) + "px";


    fenetreEnDeplacement.style.top =
        (
            event.clientY -
            decalageY
        ) + "px";
}


function terminerDeplacement(){

    fenetreEnDeplacement =
        null;


    document.removeEventListener(
        "mousemove",
        deplacerFenetre
    );

    document.removeEventListener(
        "mouseup",
        terminerDeplacement
    );
}


/* =========================
   DÉPLACEMENT DU CADRAGE
   DE L'IMAGE ZOOMÉE
========================= */

let imageEnDeplacement = null;

let imageDepartX = 0;
let imageDepartY = 0;

let positionDepartX = 0;
let positionDepartY = 0;


function commencerDeplacementImage(
    event,
    numero
){

    /*
       Seulement lorsque l'image
       est réellement zoomée.
    */

    if(zooms[numero] <= 1){

        return;
    }


    /*
       Ne pas déclencher le déplacement
       si on attrape un élément de fenêtre.
    */

    if(
        event.target.closest(".resize") ||
        event.target.closest("button") ||
        event.target.closest(".fermer-photo")
    ){

        return;
    }


    const conteneur =
        document.getElementById(
            "conteneur-image-" + numero
        );


    /*
       On attrape le cadrage.
    */

    imageEnDeplacement =
        numero;


    imageDepartX =
        event.clientX;

    imageDepartY =
        event.clientY;


    positionDepartX =
        positionsImage[numero].x;

    positionDepartY =
        positionsImage[numero].y;


    /*
       La fenêtre saisie passe devant.
    */

    const fenetre =
        document.getElementById(
            "fenetre-" + numero
        );

    fenetre.style.zIndex =
        "10";


    document.addEventListener(
        "mousemove",
        deplacerImage
    );

    document.addEventListener(
        "mouseup",
        terminerDeplacementImage
    );


    event.preventDefault();
}


function deplacerImage(event){

    if(
        imageEnDeplacement === null
    ){

        return;
    }


    const numero =
        imageEnDeplacement;


    const deltaX =
        event.clientX -
        imageDepartX;

    const deltaY =
        event.clientY -
        imageDepartY;


    positionsImage[numero].x =
        positionDepartX + deltaX;

    positionsImage[numero].y =
        positionDepartY + deltaY;


    appliquerZoom(numero);
}


function terminerDeplacementImage(){

    imageEnDeplacement =
        null;


    document.removeEventListener(
        "mousemove",
        deplacerImage
    );

    document.removeEventListener(
        "mouseup",
        terminerDeplacementImage
    );
}


/* =========================
   REDIMENSIONNEMENT
========================= */

let fenetreRedimensionnement =
    null;

let coinRedimensionnement =
    null;

let departX = 0;
let departY = 0;

let largeurDepart = 0;
let hauteurDepart = 0;

let gaucheDepart = 0;
let hautDepart = 0;

let ratioFenetre = 1;


/* =========================
   COMMENCER REDIMENSIONNEMENT
========================= */

function commencerRedimensionnement(
    event,
    numero,
    coin
){

    event.stopPropagation();
    event.preventDefault();


    const fenetre =
        document.getElementById(
            "fenetre-" + numero
        );

    const image =
        document.getElementById(
            "image-successives-" + numero
        );


    fenetreRedimensionnement =
        fenetre;

    coinRedimensionnement =
        coin;


    const rectangle =
        fenetre.getBoundingClientRect();


    departX =
        event.clientX;

    departY =
        event.clientY;


    largeurDepart =
        rectangle.width;

    hauteurDepart =
        rectangle.height;


    gaucheDepart =
        rectangle.left;

    hautDepart =
        rectangle.top;


    /*
       Ratio exact de la fenêtre.

       On utilise les dimensions
       actuelles de la fenêtre.
    */

    ratioFenetre =
        largeurDepart /
        hauteurDepart;


    /*
       La fenêtre passe devant.
    */

    fenetre.style.zIndex =
        "10";


    document.addEventListener(
        "mousemove",
        redimensionnerFenetre
    );

    document.addEventListener(
        "mouseup",
        terminerRedimensionnement
    );
}


/* =========================
   REDIMENSIONNER
========================= */

function redimensionnerFenetre(event){

    if(!fenetreRedimensionnement){

        return;
    }


    const deltaX =
        event.clientX -
        departX;

    const deltaY =
        event.clientY -
        departY;


    /*
       On utilise le mouvement
       correspondant au coin.
    */

    let variation;


    if(
        Math.abs(deltaX) >
        Math.abs(deltaY)
    ){

        variation =
            deltaX;

    }

    else{

        variation =
            deltaY;
    }


    let nouvelleLargeur;
    let nouvelleHauteur;

    let nouvelleGauche =
        gaucheDepart;

    let nouveauHaut =
        hautDepart;


    /*
       BAS DROIT
    */

    if(
        coinRedimensionnement === "br"
    ){

        nouvelleLargeur =
            largeurDepart +
            variation;

        nouvelleHauteur =
            nouvelleLargeur /
            ratioFenetre;
    }


    /*
       BAS GAUCHE
    */

    if(
        coinRedimensionnement === "bl"
    ){

        nouvelleLargeur =
            largeurDepart -
            variation;

        nouvelleHauteur =
            nouvelleLargeur /
            ratioFenetre;

        nouvelleGauche =
            gaucheDepart +
            (
                largeurDepart -
                nouvelleLargeur
            );
    }


    /*
       HAUT DROIT
    */

    if(
        coinRedimensionnement === "tr"
    ){

        nouvelleLargeur =
            largeurDepart +
            variation;

        nouvelleHauteur =
            nouvelleLargeur /
            ratioFenetre;

        nouveauHaut =
            hautDepart +
            (
                hauteurDepart -
                nouvelleHauteur
            );
    }


    /*
       HAUT GAUCHE
    */

    if(
        coinRedimensionnement === "tl"
    ){

        nouvelleLargeur =
            largeurDepart -
            variation;

        nouvelleHauteur =
            nouvelleLargeur /
            ratioFenetre;

        nouvelleGauche =
            gaucheDepart +
            (
                largeurDepart -
                nouvelleLargeur
            );

        nouveauHaut =
            hautDepart +
            (
                hauteurDepart -
                nouvelleHauteur
            );
    }


    /*
       Taille minimale.
    */

    const largeurMinimum =
        240;

    const hauteurMinimum =
        largeurMinimum /
        ratioFenetre;


    if(
        nouvelleLargeur <
        largeurMinimum
    ){

        nouvelleLargeur =
            largeurMinimum;

        nouvelleHauteur =
            nouvelleLargeur /
            ratioFenetre;
    }


    /*
       Appliquer.
    */

    fenetreRedimensionnement.style.width =
        nouvelleLargeur + "px";

    fenetreRedimensionnement.style.height =
        nouvelleHauteur + "px";

    fenetreRedimensionnement.style.left =
        nouvelleGauche + "px";

    fenetreRedimensionnement.style.top =
        nouveauHaut + "px";

    fenetreRedimensionnement.style.right =
        "auto";


    /*
       IMPORTANT :
       on recalcule la taille réelle
       de l'image après chaque
       redimensionnement.
    */

    const numero =
        fenetreRedimensionnement.id
            .replace("fenetre-","");


    /*
       Si l'image n'est pas zoomée,
       elle doit suivre exactement
       la nouvelle taille de la fenêtre.
    */

    if(zooms[numero] === 1){

        appliquerTailleImage(numero);
    }
}


/* =========================
   FIN REDIMENSIONNEMENT
========================= */

function terminerRedimensionnement(){

    fenetreRedimensionnement =
        null;

    coinRedimensionnement =
        null;


    document.removeEventListener(
        "mousemove",
        redimensionnerFenetre
    );

    document.removeEventListener(
        "mouseup",
        terminerRedimensionnement
    );
}


/* =========================
   REDIMENSIONNEMENT DE
   LA FENÊTRE DU NAVIGATEUR
========================= */

window.addEventListener(
    "resize",
    function(){

        /*
           On recalcule seulement
           les images qui ne sont pas
           zoomées.
        */

        if(
            document.getElementById(
                "photos-popup"
            ).style.display === "block"
        ){

            if(zooms[1] === 1){

                appliquerTailleImage(1);
            }

            if(zooms[2] === 1){

                appliquerTailleImage(2);
            }
        }

    }
);


/* =========================
   CLAVIER
========================= */

document.addEventListener(
    "keydown",
    function(event){

        const popupOuvert =
            document.getElementById(
                "popup"
            ).style.display === "flex";


        if(
            popupOuvert &&
            event.key === "ArrowRight"
        ){

            imageSuivante();
        }


        if(
            popupOuvert &&

        ){

            imagePrecedente();
        }


        if(
            popupOuvert &&
            event.key === "Escape"
        ){

            fermerPopup();
        }

    }
);

<script>

/* =========================================================

========================================================= */

const normoDessins = [];

    normoDessins.push(
        "n1-" + i + ".jpg"
    );

}


/* =========================================================
   LISTE DES PHOTOS
========================================================= */

const photosInstallation = [

    "n1-install1.jpg",
    "n1-install2.jpg",
    "n1-install3.jpg",
    "n1-install4.jpg"

];


/* =========================================================
   VARIABLES
========================================================= */

let normoDessinActuel = 0;

let photoInstallationActuelle = 0;

let normographeDejaOuvert = false;

let dessinsPrecharges = false;

const imagesPrechargees = [];


/* =========================================================
   PRÉCHARGEMENT
========================================================= */

function prechargerDessins(){


    const promesses = [];


    normoDessins.forEach(
        function(src){


            const image =
                new Image();


            imagesPrechargees.push(
                image
            );


            const promesse =
                new Promise(
                    function(resolve){


                        image.onload =
                            function(){


                                if(
                                    typeof image.decode ===
                                    "function"
                                ){

                                    image.decode()
                                        .catch(
                                            function(){}
                                        )
                                        .finally(
                                            function(){

                                                resolve();

                                            }
                                        );

                                }

                                else{

                                    resolve();

                                }

                            };


                        image.onerror =
                            function(){

                                resolve();

                            };


                        image.src =
                            src;


                    }
                );


            promesses.push(
                promesse
            );


        }
    );


    Promise.all(
        promesses
    ).then(
        function(){

            dessinsPrecharges = true;

        }
    );

}


prechargerDessins();

function creerDessinsNormographe(){


    const espace =
        document.getElementById(
            "dessins-espace"
        );


    /*
       Ne jamais les recréer.
    */

    if(
        espace.children.length > 0
    ){

        return;

    }


    normoDessins.forEach(
        function(src,index){


            const image =
                document.createElement("img");


            image.className =
                "normo-dessin";


            image.src =
                src;


            image.alt =
                "Dessin " +
                (index + 1);


            image.dataset.index =
                index;


            /*
               Chaque image est indépendante.
            */

            image.addEventListener(
                "click",
                function(event){


                    event.stopPropagation();


                    ouvrirNormoDessin(
                        parseInt(
                            this.dataset.index
                        )
                    );


                }
            );


            espace.appendChild(
                image
            );


        }
    );

}



/* =========================================================
   POSITION ALÉATOIRE
========================================================= */

function positionnerDessins(){


    const dessins =
        document.querySelectorAll(
            ".normo-dessin"
        );


    dessins.forEach(
        function(image){


            /*
               Toute la page est disponible.
            */

            const x =
                Math.random() * 88 + 3;


            const y =
                Math.random() * 78 + 5;


            /*
               Rotation discrète.
            */

            const rotation =
                Math.random() * 16 - 8;


            /*
               Différentes tailles.
            */

            const taille =
                0.72 +
                Math.random() * 0.5;


            const dx =
                Math.random() * 8 - 4;


            const dy =
                Math.random() * 8 - 4;


            image.style.left =
                x + "%";


            image.style.top =
                y + "%";


            image.style.width =
                (150 * taille) + "px";


            image.style.setProperty(
                "--rotation",
                rotation + "deg"
            );


            image.style.setProperty(
                "--dx",
                dx + "px"
            );


            image.style.setProperty(
                "--dy",
                dy + "px"
            );


            image.style.transform =
                "rotate(" +
                rotation +
                "deg)";


            image.style.zIndex =
                100 +
                Math.floor(
                    Math.random() * 500
                );


        }
    );

}



/* =========================================================
   OUVRIR LES 32 DESSINS
========================================================= */

async function ouvrirVueDessins(){


    const vue =
        document.getElementById(
            "vue-dessins"
        );


    const bouton =
        document.getElementById(
            "melanger-normographe"
        );


    /*
       Le PNG apparaît immédiatement.
    */

    vue.style.display =
        "block";


    /*
       Le bouton n'existe visuellement
       qu'une fois dans cette vue.
    */

    bouton.style.display =
        "block";


    /*
       Création une seule fois.
    */

    creerDessinsNormographe();


    /*
       Attendre que les images soient
       réellement chargées.
    */

    if(
        !dessinsPrecharges
    ){

        while(
            !dessinsPrecharges
        ){

            await new Promise(
                function(resolve){

                    setTimeout(
                        resolve,
                        20
                    );

                }
            );

        }

    }


    /*
       Nouvelle répartition.
    */

    positionnerDessins();


    const dessins =
        document.querySelectorAll(
            ".normo-dessin"
        );


    /*
       Tous invisibles au départ.
    */

    dessins.forEach(
        function(image){

            image.classList.remove(
                "visible"
            );

            image.style.opacity =
                "0";

        }
    );


    /*
       Première apparition :
       environ 1 seconde pour les 32.
    */

    const delai =
        normographeDejaOuvert
            ? 8
            : 30;


    /*
       Apparition indépendante
       de chaque image.
    */

    dessins.forEach(
        function(image,index){


            setTimeout(
                function(){


                    image.classList.add(
                        "visible"
                    );


                    image.style.opacity =
                        "1";


                },
                index * delai
            );


        }
    );


    normographeDejaOuvert =
        true;

}



/* =========================================================
   MÉLANGER
========================================================= */

function melangerNormographe(){


    positionnerDessins();


    /*
       On garde les images visibles.
    */

    const dessins =
        document.querySelectorAll(
            ".normo-dessin"
        );


    dessins.forEach(
        function(image){

            image.classList.add(
                "visible"
            );

            image.style.opacity =
                "1";

        }
    );

}



/* =========================================================
   QUITTER EN CLIQUANT DANS LE VIDE
========================================================= */

document.getElementById(
    "vue-dessins"
).addEventListener(
    "click",
    function(event){


        /*
           Clic sur le fond blanc.
        */

        if(
            event.target === this
        ){

            fermerVueDessins();

        }


    }
);



/* =========================================================
   FERMER LA VUE
========================================================= */

function fermerVueDessins(){


    const dessins =
        document.querySelectorAll(
            ".normo-dessin"
        );


    /*
       On les cache seulement.

       Ils restent chargés.
    */

    dessins.forEach(
        function(image){

            image.classList.remove(
                "visible"
            );

            image.style.opacity =
                "0";

        }
    );


    document.getElementById(
        "melanger-normographe"
    ).style.display =
        "none";


    document.getElementById(
        "vue-dessins"
    ).style.display =
        "none";

}



/* =========================================================
   POPUP DESSIN
========================================================= */

function ouvrirNormoDessin(index){


    normoDessinActuel =
        index;


    document.getElementById(
        "normo-dessin-popup-image"
    ).src =
        normoDessins[
            index
        ];


    document.getElementById(
        "normo-dessin-numero"
    ).textContent =
        (index + 1)
        + " / "
        + normoDessins.length;


    document.getElementById(
        "normo-dessin-popup"
    ).style.display =
        "flex";

}



/* =========================================================
   DESSIN SUIVANT
========================================================= */

function dessinNormoSuivant(){


    normoDessinActuel++;


    if(
        normoDessinActuel >=
        normoDessins.length
    ){

        normoDessinActuel = 0;

    }


    mettreAJourNormoDessin();

}



/* =========================================================
   DESSIN PRÉCÉDENT
========================================================= */

function dessinNormoPrecedent(){


    normoDessinActuel--;


    if(
        normoDessinActuel < 0
    ){

        normoDessinActuel =
            normoDessins.length - 1;

    }


    mettreAJourNormoDessin();

}



/* =========================================================
   ACTUALISER DESSIN
========================================================= */

function mettreAJourNormoDessin(){


    document.getElementById(
        "normo-dessin-popup-image"
    ).src =
        normoDessins[
            normoDessinActuel
        ];


    document.getElementById(
        "normo-dessin-numero"
    ).textContent =
        (normoDessinActuel + 1)
        + " / "
        + normoDessins.length;

}



/* =========================================================
   FERMER DESSIN
========================================================= */

function fermerNormoDessin(){


    document.getElementById(
        "normo-dessin-popup"
    ).style.display =
        "none";

}



/* =========================================================
   MENU INSTALLATION
========================================================= */

    document.getElementById(
        "installation-menu"
    ).style.display =
        "block";

}


function fermerMenuInstallation(){


    document.getElementById(
        "installation-menu"
    ).style.display =

}



/* =========================================================
   PHOTO INSTALLATION
========================================================= */

function ouvrirPhotoInstallation(index){


    photoInstallationActuelle =
        index;


    document.getElementById(
        "installation-photo-image"
    ).src =
        photosInstallation[
            index
        ];


    document.getElementById(
        "installation-photo-numero"
    ).textContent =
        (index + 1)
        + " / "
        + photosInstallation.length;


    document.getElementById(
        "installation-photo-popup"

}



/* =========================================================
   PHOTO SUIVANTE
========================================================= */

function photoInstallationSuivante(){


    photoInstallationActuelle++;


    if(
        photoInstallationActuelle >=
        photosInstallation.length
    ){

        photoInstallationActuelle = 0;

    }


    mettreAJourPhotoInstallation();

}



/* =========================================================
   PHOTO PRÉCÉDENTE
========================================================= */

function photoInstallationPrecedente(){


    photoInstallationActuelle--;


    if(
        photoInstallationActuelle < 0
    ){

        photoInstallationActuelle =
            photosInstallation.length - 1;

    }


    mettreAJourPhotoInstallation();

}



/* =========================================================
   ACTUALISER PHOTO
========================================================= */

function mettreAJourPhotoInstallation(){


    document.getElementById(
        "installation-photo-image"
    ).src =
        photosInstallation[
            photoInstallationActuelle
        ];


    document.getElementById(
        "installation-photo-numero"
    ).textContent =
        (photoInstallationActuelle + 1)
        + " / "
        + photosInstallation.length;

}



/* =========================================================
   FERMER PHOTO
========================================================= */

function fermerPhotoInstallation(){


    document.getElementById(
        "installation-photo-popup"
    ).style.display =
        "none";

}



/* =========================================================
   CLAVIER
========================================================= */

document.addEventListener(
    "keydown",
    function(event){


        /*
           POPUP DESSIN
        */

        if(
            document.getElementById(
                "normo-dessin-popup"
            ).style.display === "flex"
        ){


            if(
                event.key === "ArrowRight"
            ){

                dessinNormoSuivant();

            }


            if(
                event.key === "ArrowLeft"
            ){

                dessinNormoPrecedent();

            }


            if(
                event.key === "Escape"
            ){

                fermerNormoDessin();

            }


            return;

        }


        /*
           POPUP PHOTO
        */

        if(
            document.getElementById(
                "installation-photo-popup"
            ).style.display === "flex"
        ){


            if(
                event.key === "ArrowRight"
            ){

                photoInstallationSuivante();

            }


            if(
                event.key === "ArrowLeft"
            ){

                photoInstallationPrecedente();

            }


            if(
                event.key === "Escape"
            ){

                fermerPhotoInstallation();

            }


            return;

        }


        /*
           MENU PHOTOS
        */

        if(
            document.getElementById(
                "installation-menu"
            ).style.display === "block"
        ){


            if(
                event.key === "Escape"
            ){

                fermerMenuInstallation();

            }


            return;

        }


        /*
           VUE DES DESSINS
        */

        if(
            document.getElementById(
                "vue-dessins"
            ).style.display === "block"
        ){


            if(
                event.key === "Escape"
            ){

                fermerVueDessins();

            }

        }

    }
);

</script>
