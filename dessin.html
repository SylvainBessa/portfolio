<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Dessin</title>

<style>

body{
    margin:0;
    background:white;
    font-family:"Times New Roman", serif;
    overflow-y:auto;
    overflow-x:hidden;
}

#retour{
    position:fixed;
    top:20px;
    left:20px;
    color:blue;
    text-decoration:underline;
    font-size:18px;
    z-index:300;
}

.page{
    padding-top:90px;
    padding-bottom:160px;
}

.serie{
    width:100vw;
    margin-bottom:160px;
}


/* =========================
   TITRE + ICÔNE
========================= */

.titre-conteneur{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:25px;
}

.titre-serie{
    text-align:center;
    font-size:22px;
    margin:0;
    font-weight:normal;
    line-height:1.3;
}


/* =========================
   ICÔNE APPAREIL PHOTO
========================= */

.camera{
    position:relative;
    width:24px;
    height:17px;
    border:1.5px solid black;
    box-sizing:border-box;
    cursor:pointer;
    flex-shrink:0;
}

.camera:before{
    content:"";
    position:absolute;
    width:8px;
    height:4px;
    border:1.5px solid black;
    border-bottom:none;
    left:4px;
    top:-6px;
    box-sizing:border-box;
}

.camera:after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border:1.5px solid black;
    border-radius:50%;
    left:7px;
    top:3px;
    box-sizing:border-box;
}

.camera:hover{
    opacity:0.5;
}


/* =========================
   MENU DES DESSINS
========================= */

.menu-horizontal{
    width:100vw;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    padding:45px 60px;
    box-sizing:border-box;
    border-top:1px solid black;
    border-bottom:1px solid black;
    background:white;
}

.miniature{
    height:360px;
    margin-right:45px;
    cursor:pointer;
    vertical-align:middle;
    border:1px solid black;
}

.miniature:hover{
    opacity:0.75;
}


/* =========================
   POP-UP DES DESSINS
========================= */

#popup{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(255,255,255,0.75);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

#popup-contenu{
    position:relative;
    background:white;
    border:1px solid black;
    padding:20px;
    max-width:90vw;
    max-height:90vh;
    box-sizing:border-box;
}

#image-popup{
    display:block;
    max-width:85vw;
    max-height:82vh;
    object-fit:contain;
}

#fermer{
    position:absolute;
    top:5px;
    right:10px;
    font-size:22px;
    cursor:pointer;
    color:black;
}


/* =========================
   CONTENEUR DES PHOTOS
========================= */

#photos-popup{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(255,255,255,0.35);
    display:none;
    z-index:200;
}


/* =========================
   FENÊTRE PHOTO
========================= */

.fenetre-photo {
    position: fixed;
    width: auto;
    height: auto;
    max-width: 76vw;
    max-height: 76vh;
    overflow: hidden;

    background: white;
    border: 1px solid black;
    box-sizing: border-box;
}


/* =========================
   BARRE SUPÉRIEURE
========================= */

.barre-fenetre{
    height:30px;
    border-bottom:1px solid black;
    box-sizing:border-box;
    cursor:move;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-left:8px;
    user-select:none;
    flex-shrink:0;
}

.controles{
    display:flex;
    align-items:center;
    height:100%;
}

.bouton{
    width:28px;
    height:28px;
    border:none;
    background:white;
    font-family:"Times New Roman", serif;
    font-size:18px;
    line-height:28px;
    text-align:center;
    cursor:pointer;
    padding:0;
}

.bouton:hover{
    background:#eeeeee;
}

.pourcentage{
    font-size:13px;
    width:42px;
    text-align:center;
}

.fermer-photo{
    font-size:22px;
    line-height:28px;
    cursor:pointer;
    color:black;
    width:28px;
    height:28px;
    text-align:center;
}

.fermer-photo:hover{
    opacity:0.5;
}


/* =========================
   CONTENEUR DE L'IMAGE
========================= */

.conteneur-image{
    width:100%;
    height:calc(100% - 30px);
    padding:20px;
    box-sizing:border-box;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   IMAGE
========================= */

.fenetre-photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: calc(76vh - 30px);
    object-fit: contain;
}


/* =========================
   POSITIONS INITIALES
========================= */

#fenetre-1{
    top: 6vh;
    left: 12vw;
    z-index:1;
}

#fenetre-2{
    top: 16vh;
    right: 12vw;
    z-index:2;
}


/* =========================
   COINS DE REDIMENSIONNEMENT
========================= */

.resize{
    position:absolute;
    width:12px;
    height:12px;
    z-index:20;
}


/* coin haut gauche */

.resize-tl{
    top:-2px;
    left:-2px;
    cursor:nwse-resize;
}


/* coin haut droit */

.resize-tr{
    top:-2px;
    right:-2px;
    cursor:nesw-resize;
}


/* coin bas gauche */

.resize-bl{
    bottom:-2px;
    left:-2px;
    cursor:nesw-resize;
}


/* coin bas droit */

.resize-br{
    bottom:-2px;
    right:-2px;
    cursor:nwse-resize;
}

</style>
</head>


<body>

<a id="retour" href="index.html">retour</a>


<div class="page">

    <div class="serie">

        <div class="titre-conteneur">

            <h1 class="titre-serie">
                séquence narrative de re-dessin par couches successives
            </h1>

            <div
                class="camera"
                onclick="ouvrirPhotos()"
                title="voir les photographies"
            ></div>

        </div>


        <div class="menu-horizontal">

            <img class="miniature" src="dessin-01.jpg" onclick="ouvrirPopup(0)">
            <img class="miniature" src="dessin-02.jpg" onclick="ouvrirPopup(1)">
            <img class="miniature" src="dessin-03.jpg" onclick="ouvrirPopup(2)">
            <img class="miniature" src="dessin-04.jpg" onclick="ouvrirPopup(3)">
            <img class="miniature" src="dessin-05.jpg" onclick="ouvrirPopup(4)">
            <img class="miniature" src="dessin-06.jpg" onclick="ouvrirPopup(5)">
            <img class="miniature" src="dessin-07.jpg" onclick="ouvrirPopup(6)">

        </div>

    </div>

</div>


<!-- =========================
     POP-UP DES DESSINS
========================= -->

<div id="popup" onclick="fermerPopup()">

    <div id="popup-contenu" onclick="event.stopPropagation()">

        <div id="fermer" onclick="fermerPopup()">×</div>

        <img id="image-popup" src="" alt="">

    </div>

</div>


<!-- =========================
     FENÊTRES PHOTOS
========================= -->

<div id="photos-popup">


    <!-- FENÊTRE 1 -->

    <div id="fenetre-1" class="fenetre-photo">

        <div
            class="barre-fenetre"
            onmousedown="commencerDeplacement(event, 1)"
        >

            <span></span>

            <div class="controles">

                <button
                    class="bouton"
                    onclick="zoomPhoto(event, 1, 1.15)"
                >+</button>

                <div id="pourcentage-1" class="pourcentage">100%</div>

                <button
                    class="bouton"
                    onclick="zoomPhoto(event, 1, 0.87)"
                >−</button>

                <button
                    class="bouton"
                    onclick="resetZoom(event, 1)"
                >1:1</button>

                <div
                    class="fermer-photo"
                    onclick="fermerPhoto(1)"
                >×</div>

            </div>

        </div>


        <div class="conteneur-image">

            <img
                id="image-successives-1"
                src="successives-1.jpg"
                alt="Photographie du processus de redessin"
            >

        </div>


        <div
            class="resize resize-tl"
            onmousedown="commencerRedimensionnement(event, 1, 'tl')"
        ></div>

        <div
            class="resize resize-tr"
            onmousedown="commencerRedimensionnement(event, 1, 'tr')"
        ></div>

        <div
            class="resize resize-bl"
            onmousedown="commencerRedimensionnement(event, 1, 'bl')"
        ></div>

        <div
            class="resize resize-br"
            onmousedown="commencerRedimensionnement(event, 1, 'br')"
        ></div>

    </div>


    <!-- FENÊTRE 2 -->

    <div id="fenetre-2" class="fenetre-photo">

        <div
            class="barre-fenetre"
            onmousedown="commencerDeplacement(event, 2)"
        >

            <span></span>

            <div class="controles">

                <button
                    class="bouton"
                    onclick="zoomPhoto(event, 2, 1.15)"
                >+</button>

                <div id="pourcentage-2" class="pourcentage">100%</div>

                <button
                    class="bouton"
                    onclick="zoomPhoto(event, 2, 0.87)"
                >−</button>

                <button
                    class="bouton"
                    onclick="resetZoom(event, 2)"
                >1:1</button>

                <div
                    class="fermer-photo"
                    onclick="fermerPhoto(2)"
                >×</div>

            </div>

        </div>


        <div class="conteneur-image">

            <img
                id="image-successives-2"
                src="successives-2.jpg"
                alt="Photographie du processus de redessin"
            >

        </div>


        <div
            class="resize resize-tl"
            onmousedown="commencerRedimensionnement(event, 2, 'tl')"
        ></div>

        <div
            class="resize resize-tr"
            onmousedown="commencerRedimensionnement(event, 2, 'tr')"
        ></div>

        <div
            class="resize resize-bl"
            onmousedown="commencerRedimensionnement(event, 2, 'bl')"
        ></div>

        <div
            class="resize resize-br"
            onmousedown="commencerRedimensionnement(event, 2, 'br')"
        ></div>

    </div>

</div>


<script>


/* =========================
   DESSINS
========================= */

const dessins = [
    "dessin-01.jpg",
    "dessin-02.jpg",
    "dessin-03.jpg",
    "dessin-04.jpg",
    "dessin-05.jpg",
    "dessin-06.jpg",
    "dessin-07.jpg"
];

let imageActuelle = 0;


/* =========================
   OUVRIR UN DESSIN
========================= */

function ouvrirPopup(index){

    imageActuelle = index;

    document.getElementById("image-popup").src =
        dessins[imageActuelle];

    document.getElementById("popup").style.display =
        "flex";
}


/* =========================
   FERMER UN DESSIN
========================= */

function fermerPopup(){

    document.getElementById("popup").style.display =
        "none";

    document.getElementById("image-popup").src =
        "";
}


/* =========================
   DESSIN SUIVANT
========================= */

function imageSuivante(){

    imageActuelle++;

    if(imageActuelle >= dessins.length){
        imageActuelle = 0;
    }

    document.getElementById("image-popup").src =
        dessins[imageActuelle];
}


/* =========================
   DESSIN PRÉCÉDENT
========================= */

function imagePrecedente(){

    imageActuelle--;

    if(imageActuelle < 0){
        imageActuelle = dessins.length - 1;
    }

    document.getElementById("image-popup").src =
        dessins[imageActuelle];
}


/* =========================
   OUVRIR LES PHOTOS
========================= */

function ouvrirPhotos(){

    const photosPopup =
        document.getElementById("photos-popup");

    const fenetre1 =
        document.getElementById("fenetre-1");

    const fenetre2 =
        document.getElementById("fenetre-2");

    photosPopup.style.display = "block";

    fenetre1.style.display = "block";
    fenetre2.style.display = "block";

    fenetre1.style.zIndex = "1";
    fenetre2.style.zIndex = "2";

    zooms[1] = 1;
    zooms[2] = 1;

    initialiserFenetre(1);
    initialiserFenetre(2);
}


/* =========================
   INITIALISATION DES FENÊTRES
========================= */

function initialiserFenetre(numero){

    const fenetre =
        document.getElementById("fenetre-" + numero);

    const image =
        document.getElementById("image-successives-" + numero);


    function calculer(){

        const ratio =
            image.naturalWidth / image.naturalHeight;

        if(!ratio || !isFinite(ratio)){
            return;
        }


        /*
           Taille maximale souhaitée pour l'image.
           On augmente volontairement les dimensions
           par rapport à la version précédente.
        */

        const largeurMax =
            window.innerWidth * 0.52;

        const hauteurMax =
            window.innerHeight * 0.72;


        let largeur =
            largeurMax;

        let hauteur =
            largeur / ratio;


        if(hauteur > hauteurMax){

            hauteur = hauteurMax;
            largeur = hauteur * ratio;
        }


        /*
           On réserve l'espace pour :
           - la bordure
           - la barre supérieure
           - les marges autour de l'image
        */

        const largeurFenetre =
            largeur + 42;

        const hauteurFenetre =
            hauteur + 72;


        fenetre.style.width =
            largeurFenetre + "px";

        fenetre.style.height =
            hauteurFenetre + "px";


        /*
           Positionnement initial.
           La deuxième fenêtre vient légèrement
           recouvrir la première.
        */

        if(numero === 1){

            fenetre.style.left =
                Math.round(window.innerWidth * 0.08) + "px";

            fenetre.style.top =
                Math.round(window.innerHeight * 0.08) + "px";
        }

        else{

            fenetre.style.left =
                Math.round(window.innerWidth * 0.38) + "px";

            fenetre.style.top =
                Math.round(window.innerHeight * 0.20) + "px";
        }
    }


    if(image.complete && image.naturalWidth){

        calculer();

    }else{

        image.addEventListener(
            "load",
            calculer,
            {once:true}
        );
    }
}


/* =========================
   FERMER UNE PHOTO
========================= */

function fermerPhoto(numero){

    document.getElementById(
        "fenetre-" + numero
    ).style.display = "none";


    const photo1 =
        document.getElementById("fenetre-1").style.display;

    const photo2 =
        document.getElementById("fenetre-2").style.display;


    if(photo1 === "none" && photo2 === "none"){

        document.getElementById(
            "photos-popup"
        ).style.display = "none";
    }
}


/* =========================
   ZOOM
========================= */

let zooms = {
    1:1,
    2:1
};


function zoomPhoto(event, numero, facteur){

    event.stopPropagation();

    let nouveauZoom =
        zooms[numero] * facteur;


    if(nouveauZoom < 0.5){
        nouveauZoom = 0.5;
    }

    if(nouveauZoom > 4){
        nouveauZoom = 4;
    }


    zooms[numero] = nouveauZoom;

    appliquerZoom(numero);
}


function appliquerZoom(numero){

    const image =
        document.getElementById(
            "image-successives-" + numero
        );


    image.style.transform =
        "scale(" + zooms[numero] + ")";


    document.getElementById(
        "pourcentage-" + numero
    ).textContent =
        Math.round(zooms[numero] * 100) + "%";
}


function resetZoom(event, numero){

    event.stopPropagation();

    zooms[numero] = 1;

    appliquerZoom(numero);
}


/* =========================
   DÉPLACEMENT
========================= */

let fenetreEnDeplacement = null;

let decalageX = 0;
let decalageY = 0;


function commencerDeplacement(event, numero){

    if(
        event.target.closest("button") ||
        event.target.closest(".fermer-photo")
    ){
        return;
    }


    const fenetre =
        document.getElementById("fenetre-" + numero);


    fenetreEnDeplacement = fenetre;


    const rectangle =
        fenetre.getBoundingClientRect();


    decalageX =
        event.clientX - rectangle.left;

    decalageY =
        event.clientY - rectangle.top;


    fenetre.style.left =
        rectangle.left + "px";

    fenetre.style.top =
        rectangle.top + "px";

    fenetre.style.right =
        "auto";


    /*
       La fenêtre attrapée passe devant.
    */

    fenetre.style.zIndex = "10";


    document.addEventListener(
        "mousemove",
        deplacerFenetre
    );

    document.addEventListener(
        "mouseup",
        terminerDeplacement
    );


    event.preventDefault();
}


function deplacerFenetre(event){

    if(!fenetreEnDeplacement){
        return;
    }


    fenetreEnDeplacement.style.left =
        (event.clientX - decalageX) + "px";

    fenetreEnDeplacement.style.top =
        (event.clientY - decalageY) + "px";
}


function terminerDeplacement(){

    fenetreEnDeplacement = null;


    document.removeEventListener(
        "mousemove",
        deplacerFenetre
    );

    document.removeEventListener(
        "mouseup",
        terminerDeplacement
    );
}


/* =========================
   REDIMENSIONNEMENT
========================= */

let fenetreRedimensionnement = null;
let coinRedimensionnement = null;

let departX = 0;
let departY = 0;

let largeurDepart = 0;
let hauteurDepart = 0;

let gaucheDepart = 0;
let hautDepart = 0;

let ratioFenetre = 1;


/* =========================
   COMMENCER REDIMENSIONNEMENT
========================= */

function commencerRedimensionnement(
    event,
    numero,
    coin
){

    event.stopPropagation();
    event.preventDefault();


    const fenetre =
        document.getElementById("fenetre-" + numero);

    const image =
        document.getElementById(
            "image-successives-" + numero
        );


    fenetreRedimensionnement = fenetre;
    coinRedimensionnement = coin;


    const rectangle =
        fenetre.getBoundingClientRect();


    departX = event.clientX;
    departY = event.clientY;


    largeurDepart =
        rectangle.width;

    hauteurDepart =
        rectangle.height;


    gaucheDepart =
        rectangle.left;

    hautDepart =
        rectangle.top;


    /*
       Ratio réel de la photographie.

       On ajoute les dimensions fixes de la fenêtre
       (barre + marges) pour conserver exactement
       le ratio visuel de la photo.
    */

    if(
        image.naturalWidth &&
        image.naturalHeight
    ){

        const ratioImage =
            image.naturalWidth / image.naturalHeight;

        const espaceHorizontal = 42;
        const espaceVertical = 72;

        ratioFenetre =
            (image.naturalWidth + espaceHorizontal) /
            (image.naturalHeight + espaceVertical);
    }

    else{

        ratioFenetre =
            largeurDepart / hauteurDepart;
    }


    document.addEventListener(
        "mousemove",
        redimensionnerFenetre
    );

    document.addEventListener(
        "mouseup",
        terminerRedimensionnement
    );
}


/* =========================
   REDIMENSIONNER
========================= */

function redimensionnerFenetre(event){

    if(!fenetreRedimensionnement){
        return;
    }


    const deltaX =
        event.clientX - departX;

    const deltaY =
        event.clientY - departY;


    let nouvelleLargeur =
        largeurDepart;

    let nouvelleHauteur =
        hauteurDepart;

    let nouvelleGauche =
        gaucheDepart;

    let nouveauHaut =
        hautDepart;


    /*
       On choisit la variation correspondant
       au mouvement principal de la souris.
    */

    let variation;


    if(
        Math.abs(deltaX) >
        Math.abs(deltaY)
    ){

        variation = deltaX;

    }else{

        variation = deltaY;
    }


    /*
       BAS DROIT
    */

    if(
        coinRedimensionnement === "br"
    ){

        nouvelleLargeur =
            largeurDepart + variation;

        nouvelleHauteur =
            nouvelleLargeur / ratioFenetre;
    }


    /*
       BAS GAUCHE
    */

    if(
        coinRedimensionnement === "bl"
    ){

        nouvelleLargeur =
            largeurDepart - variation;

        nouvelleHauteur =
            nouvelleLargeur / ratioFenetre;

        nouvelleGauche =
            gaucheDepart +
            (largeurDepart - nouvelleLargeur);
    }


    /*
       HAUT DROIT
    */

    if(
        coinRedimensionnement === "tr"
    ){

        nouvelleLargeur =
            largeurDepart + variation;

        nouvelleHauteur =
            nouvelleLargeur / ratioFenetre;

        nouveauHaut =
            hautDepart +
            (hauteurDepart - nouvelleHauteur);
    }


    /*
       HAUT GAUCHE
    */

    if(
        coinRedimensionnement === "tl"
    ){

        nouvelleLargeur =
            largeurDepart - variation;

        nouvelleHauteur =
            nouvelleLargeur / ratioFenetre;

        nouvelleGauche =
            gaucheDepart +
            (largeurDepart - nouvelleLargeur);

        nouveauHaut =
            hautDepart +
            (hauteurDepart - nouvelleHauteur);
    }


    /*
       Taille minimale.
    */

    const largeurMinimum = 240;
    const hauteurMinimum = 180;


    if(
        nouvelleLargeur < largeurMinimum
    ){

        nouvelleLargeur =
            largeurMinimum;

        nouvelleHauteur =
            nouvelleLargeur / ratioFenetre;
    }


    if(
        nouvelleHauteur < hauteurMinimum
    ){

        nouvelleHauteur =
            hauteurMinimum;

        nouvelleLargeur =
            nouvelleHauteur * ratioFenetre;
    }


    /*
       Appliquer.
    */

    fenetreRedimensionnement.style.width =
        nouvelleLargeur + "px";

    fenetreRedimensionnement.style.height =
        nouvelleHauteur + "px";

    fenetreRedimensionnement.style.left =
        nouvelleGauche + "px";

    fenetreRedimensionnement.style.top =
        nouveauHaut + "px";

    fenetreRedimensionnement.style.right =
        "auto";
}


/* =========================
   FIN REDIMENSIONNEMENT
========================= */

function terminerRedimensionnement(){

    fenetreRedimensionnement = null;

    coinRedimensionnement = null;


    document.removeEventListener(
        "mousemove",
        redimensionnerFenetre
    );

    document.removeEventListener(
        "mouseup",
        terminerRedimensionnement
    );
}


/* =========================
   CLAVIER
========================= */

document.addEventListener(
    "keydown",
    function(event){

        const popupOuvert =
            document.getElementById(
                "popup"
            ).style.display === "flex";


        if(
            popupOuvert &&
            event.key === "ArrowRight"
        ){

            imageSuivante();
        }


        if(
            popupOuvert &&
            event.key === "ArrowLeft"
        ){

            imagePrecedente();
        }


        if(
            popupOuvert &&
            event.key === "Escape"
        ){

            fermerPopup();
        }

    }
);
