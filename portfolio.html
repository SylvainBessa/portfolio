<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    const PDF_FILE = "SYLVAIN_BESSA_dossiervisuel_léger.pdf";
    const MAX_WIDTH = 900;
    const MAX_PIXEL_RATIO = 2;
    const PRELOAD_DISTANCE = 4;
    const MAX_CONCURRENT_RENDERS = 2;

    const container = document.getElementById("pdf");

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pdf = null;
    let activeRenders = 0;

    const renderedPages = new Map();
    const queuedPages = new Set();
    const queue = [];


    function getWidth() {
        return Math.min(
            MAX_WIDTH,
            window.innerWidth - 40
        );
    }


    function getPixelRatio() {
        return Math.min(
            window.devicePixelRatio || 1,
            MAX_PIXEL_RATIO
        );
    }


    function addToQueue(pageNumber, priority = false) {
        if (
            pageNumber < 1 ||
            pageNumber > pdf.numPages ||
            renderedPages.has(pageNumber) ||
            queuedPages.has(pageNumber)
        ) {
            return;
        }

        queuedPages.add(pageNumber);

        if (priority) {
            queue.unshift(pageNumber);
        } else {
            queue.push(pageNumber);
        }

        processQueue();
    }


    function processQueue() {
        while (
            activeRenders < MAX_CONCURRENT_RENDERS &&
            queue.length > 0
        ) {
            const pageNumber = queue.shift();

            activeRenders++;

            renderPage(pageNumber)
                .finally(() => {
                    activeRenders--;
                    queuedPages.delete(pageNumber);
                    processQueue();
                });
        }
    }


    async function renderPage(pageNumber) {
        const page = await pdf.getPage(pageNumber);

        const baseViewport = page.getViewport({
            scale: 1
        });

        const width = getWidth();

        const scale = width / baseViewport.width;

        const viewport = page.getViewport({
            scale: scale
        });

        const ratio = getPixelRatio();

        const canvas = document.createElement("canvas");

        canvas.className = "page";
        canvas.dataset.page = pageNumber;

        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;

        canvas.width = Math.ceil(viewport.width * ratio);
        canvas.height = Math.ceil(viewport.height * ratio);

        container.appendChild(canvas);

        const context = canvas.getContext("2d", {
            alpha: false,
            desynchronized: true
        });

        context.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );

        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;

        renderedPages.set(pageNumber, canvas);

        canvas.classList.add("ready");

        return canvas;
    }


    function preloadPages(startPage) {
        const endPage = Math.min(
            pdf.numPages,
            startPage + PRELOAD_DISTANCE - 1
        );

        for (
            let pageNumber = startPage;
            pageNumber <= endPage;
            pageNumber++
        ) {
            addToQueue(pageNumber);
        }
    }


    function observePages() {
        const observer = new IntersectionObserver(
            entries => {
                for (const entry of entries) {
                    if (!entry.isIntersecting) {
                        continue;
                    }

                    const pageNumber = Number(
                        entry.target.dataset.page
                    );

                    preloadPages(pageNumber + 1);
                }
            },
            {
                rootMargin: "2500px 0px 2500px 0px",
                threshold: 0
            }
        );

        function observeNewPages() {
            for (const canvas of renderedPages.values()) {
                if (canvas.dataset.observed) {
                    continue;
                }

                canvas.dataset.observed = "true";
                observer.observe(canvas);
            }

            requestAnimationFrame(observeNewPages);
        }

        observeNewPages();
    }


    async function start() {
        pdf = await pdfjsLib.getDocument({
            url: PDF_FILE,
            disableStream: false,
            disableAutoFetch: false,
            useWorkerFetch: true,
            isOffscreenCanvasSupported: true
        }).promise;

        addToQueue(1, true);

        while (!renderedPages.has(1)) {
            await new Promise(resolve =>
                requestAnimationFrame(resolve)
            );
        }

        preloadPages(2);
        observePages();
    }


    start();
</script>
